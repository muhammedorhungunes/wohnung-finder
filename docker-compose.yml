services:
  postgres:
    image: postgres:16-alpine
    container_name: wohnung-finder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wohnung}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wohnung}
      POSTGRES_DB: ${POSTGRES_DB:-wohnung_finder}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
